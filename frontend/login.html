<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BuilderSync · Sign in</title><link rel="stylesheet" href="/static/style.css"></head>
<body style="align-items:center;justify-content:center">
<div id="toast" class="toast"></div>
<div class="center-box card">
  <img class="emblem" src="/static/logo.png" alt="AWS Student Builder Group – Jose Rizal University">
  <h3 style="justify-content:center;font-size:1.5rem">BuilderSync</h3>
  <p class="note" style="text-align:center">AWS Student Builder Group · JRU Chapter</p>
  <form id="emailForm" class="stack">
    <input id="email" type="email" placeholder="School email (e.g. name@jru.edu)" autocomplete="username" required>
    <label class="note"><input type="checkbox" id="personal"> Send the code to my personal email instead</label>
    <button class="gold">Email me a login code</button>
  </form>
  <form id="codeForm" class="stack hidden">
    <p class="note" id="sentMsg"></p>
    <input id="code" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" required style="text-align:center;letter-spacing:6px;font-size:1.3rem">
    <button class="gold">Sign in</button>
    <button type="button" class="ghost" id="back">Use a different email</button>
  </form>
</div>
<script src="/static/common.js"></script>
<script>
$("#emailForm").addEventListener("submit", guard(async (e) => {
  e.preventDefault();
  const r = await api("/api/auth/request-code", jsonOpts("POST", { email: $("#email").value.trim(), send_to_personal: $("#personal").checked }));
  $("#sentMsg").textContent = "If that email is registered, a code was sent. It expires in 10 minutes.";
  if (r.demo_code) { $("#sentMsg").innerHTML = `<b style="color:var(--gold)">DEMO MODE</b>: email is not connected yet. Your code is <b style="font-size:1.2rem;letter-spacing:3px">${r.demo_code}</b>`; $("#code").value = r.demo_code; }
  $("#emailForm").classList.add("hidden"); $("#codeForm").classList.remove("hidden"); $("#code").focus();
}));
$("#codeForm").addEventListener("submit", guard(async (e) => {
  e.preventDefault();
  const r = await api("/api/auth/verify", jsonOpts("POST", { email: $("#email").value.trim(), code: $("#code").value.trim() }));
  location.href = r.redirect;
}));
$("#back").addEventListener("click", () => { $("#codeForm").classList.add("hidden"); $("#emailForm").classList.remove("hidden"); $("#code").value = ""; });
</script></body></html>
